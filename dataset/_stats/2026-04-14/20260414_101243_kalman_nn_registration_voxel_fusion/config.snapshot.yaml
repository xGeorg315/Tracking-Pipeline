input:
  paths:
  - qb2_live://class_qb2@10.16.3.160
  format: qb2_live
  qb2_live:
    sensor_name: class_qb2
    ip: 10.16.3.160
    api_key: 001bf3f34b7912994pysYScYzbIquTIp
    mqtt:
      host: 10.16.3.111
      port: 1883
      topic: blickfeld/states_160
      keepalive: 60
    max_frames: 0
    idle_timeout_sec: 30.0
    mqtt_drain_tolerance_sec: 0.25
    mqtt_max_pending_age_sec: 3.0
preprocessing:
  lane_box:
  - -2.1
  - 1.8
  - 4.0
  - 35.3
  - 0.12
  - 4.8
  bootstrap_frames: 10
clustering:
  algorithm: dbscan
  eps: 0.9
  voxel_size: 0.25
  min_points: 8
  vehicle_min_points: 20
  vehicle_max_points: 10000
  plane_distance_threshold: 0.12
  plane_ransac_n: 3
  plane_num_iterations: 120
  ground_normal_z_min: 0.75
  hdbscan_min_cluster_size: 20
  hdbscan_min_samples: 10
  sensor_range_min: 0.0
  sensor_range_max: 120.0
  sensor_depth_jump_ratio: 0.08
  sensor_depth_jump_abs: 0.45
  sensor_min_component_size: 8
  sensor_neighbor_rows: 1
  sensor_neighbor_cols: 1
  sensor_ground_row_ignore: 0
tracking:
  algorithm: kalman_nn
  max_dist: 7.5
  max_missed: 2
  min_track_hits: 6
  sticky_extra_dist_per_missed: 1.0
  sticky_max_dist: 12.0
  kf_init_var: 5.0
  kf_process_var: 0.8
  kf_meas_var: 1.2
  association_size_weight: 0.05
  fragment_parent_min_length: 3.8
  fragment_max_lateral_offset: 1.2
  fragment_max_vertical_offset: 0.9
  fragment_child_max_length_ratio: 0.95
  fragment_child_max_point_ratio: 1.0
  fragment_max_rear_gap: 3.2
  fragment_child_max_age: 6
aggregation:
  algorithm: registration_voxel_fusion
  symmetry_completion: false
  motion_deskew: true
  truncate_after_lane_end_touch: true
  frame_selection_method: keyframe_motion
  use_all_frames: true
  top_k_frames: 10
  keyframe_keep: 8
  chunk_quality_filter: true
  chunk_min_points_ratio_to_peak: 0.6
  chunk_min_extent_ratio_to_peak: 0.55
  chunk_min_segment_length: 4
  frame_selection_line_axis: y
  frame_selection_line_ratio: 0.1
  frame_selection_touch_margin: 0.12
  frame_downsample_voxel: 0.07
  shape_consistency_filter: false
  shape_consistency_max_extent_ratio: 2.0
  registration_backend: icp_point_to_plane
  registration_max_corr_dist: 0.5
  registration_max_iter: 30
  registration_min_fitness: 0.3
  registration_max_translation: 3.5
  enable_registration_underfill_fallback: true
  registration_min_kept_chunks: 2
  global_registration_voxel: 0.12
  fusion_voxel_size: 0.05
  fusion_min_observations: 1
  fusion_weight_mode: point_count
  consensus_ratio: 0.35
  min_track_quality_for_save: 0.0
  min_saved_aggregate_points: 50
  enable_confidence_point_cap: false
  confidence_point_cap_max_points: 2048
  confidence_point_cap_bins: 16
  long_vehicle_mode: false
  long_vehicle_length_threshold: 4.5
  length_coverage_bins: 10
  min_track_quality_for_save_long_vehicle: 0.0
  enable_tail_bridge: false
  tail_bridge_longitudinal_gap_max: 1.5
  tail_bridge_lateral_gap_max: 0.8
  tail_bridge_vertical_gap_max: 0.5
  enable_post_filter_stat_outlier_removal: true
  post_filter_stat_nb_neighbors: 12
  post_filter_stat_std_ratio: 2.3
  aggregate_voxel: 0.06
postprocessing:
  enable_tracklet_stitching: false
  stitching_max_gap: 4
  stitching_max_center_dist: 2.5
  enable_articulated_vehicle_merge: true
  articulated_gap_eval_window_frames: 5
  articulated_min_overlap_frames: 3
  articulated_min_overlap_ratio: 0.6
  articulated_max_lateral_offset: 0.6
  articulated_max_vertical_offset: 5
  articulated_max_hitch_gap: 1.75
  articulated_max_hitch_gap_std: 0.6
  articulated_max_speed_delta: 0.3
  articulated_min_combined_length: 5.0
  enable_co_moving_track_merge: false
  parallel_merge_max_lateral_offset: 0.8
  parallel_merge_max_longitudinal_gap: 4.0
  parallel_merge_min_overlap_frames: 5
  parallel_merge_min_overlap_ratio: 0.6
  enable_trajectory_smoothing: false
  smoothing_window: 3
  enable_track_quality_scoring: true
classification:
  enabled: true
  backend: pointnext
  pointnext_root: /home/vsv-admin/workspace/Tracking-Pipeline/PointNeXt
  checkpoint_path: /home/vsv-admin/workspace/Tracking-Pipeline/ckpt/bestckpt.pth
  model_cfg_path: /home/vsv-admin/workspace/Tracking-Pipeline/PointNeXt/cfgs/modelnet40ply2048/pointnext-s.yaml
  class_names:
  - Bus
  - LKW
  - "LKW-Anh\xE4nger"
  - Motorrad
  - PKW
  - "PKW-Anh\xE4nger"
  - Sattelzugmaschine
  - Transporter
  device: cpu
class_normalization:
  enabled: true
  aliases:
    PKW: TLS_VEHICLE_CAR
    "PKW-Anh\xE4nger": TLS_VEHICLE_CAR_WITH_TRAILER
    LKW: TLS_VEHICLE_TRUCK
    "LKW-Anh\xE4nger": TLS_VEHICLE_TRUCK_WITH_TRAILER
    Sattelzugmaschine: TLS_VEHICLE_SEMI_TRAILER_TRUCK
    Transporter: TLS_VEHICLE_VAN
    Bus: TLS_VEHICLE_BUS
    Motorrad: TLS_VEHICLE_MOTORBIKE
    car: TLS_VEHICLE_CAR
    truck: TLS_VEHICLE_TRUCK
    van: TLS_VEHICLE_VAN
    bus: TLS_VEHICLE_BUS
    motorbike: TLS_VEHICLE_MOTORBIKE
    motorcycle: TLS_VEHICLE_MOTORBIKE
output:
  mode: dataset
  root_dir: runs
  dataset_root_dir: dataset
  save_world: false
  save_aggregate_intensity: true
  require_track_exit: true
  track_exit_edge_margin: 5
runtime:
  cpu_cores: 4
visualization:
  enabled: true
  color_by_intensity: false
  show_full_frame_pcd: true
  show_tracker_debug: true
  show_track_outcome_debug: true
  show_articulated_merge_debug: true
  live_web_enabled: true
  live_web_host: 0.0.0.0
  live_web_port: 8765
  live_web_history_sec: 2.5
  live_web_retain_all_frames: true
  live_web_point_source: lane
  max_points: 40000
  max_cluster_points: 15000
  max_assoc_dist: 4.2
config_path: /home/vsv-admin/workspace/Tracking-Pipeline/configs/qb2_live_example.yaml
